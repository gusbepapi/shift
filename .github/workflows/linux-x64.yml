name: Build Shift for Linux x64

# Running only when the repository owner starts it from the Actions tab
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHIFT_DISTRIBUTION: nightly
      SHIFT_BUILD_ARCH: x64
      OUTPUT_ROOT: apps/desktop/out/linux-x64
    steps:
      # Checking out the sources including the submodules declared in `.gitmodules`
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true

      # Installing pnpm at the version declared by `packageManager` in `package.json`
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Installing the libraries that the build and the smoke test need
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libsqlite3-dev xvfb fluxbox \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libxkbfile1 \
            libatspi2.0-0t64 libcups2t64

      # Installing the toolchain pinned by `rust-toolchain.toml`
      - name: Install Rust toolchain
        run: rustup show

      # Installing the wasm-bindgen CLI at the version `Cargo.lock` pins, which `packages/wasm` demands
      - name: Read the wasm-bindgen version
        id: wasm-bindgen
        shell: bash
        run: |
          set -euo pipefail
          # A Windows checkout has CRLF line endings
          version=$(tr -d '\r' < Cargo.lock | awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Setting a version in the format `major.minor.patch`, kept above the upstream nightly feed so that no update prompt appears
      - name: Set build version
        run: node scripts/product-version.mjs set "0.151.${{ github.run_number }}"

      - name: Build native bridge
        run: pnpm build:native

      - name: Build command-line tool
        run: pnpm build:cli

      - name: Build desktop application
        run: pnpm --filter @shift/desktop build

      - name: Make desktop distributables
        run: pnpm --filter @shift/desktop exec electron-builder --config electron-builder.config.ts --linux tar.gz --x64 --publish never

      # Locating the directory that contains the unpacked executable
      - name: Resolve packaged application
        id: package
        run: |
          set -euo pipefail
          EXECUTABLE_PATH="$(find "$OUTPUT_ROOT" -type f -name 'shift-nightly' -perm -u+x -print -quit)"
          test -n "$EXECUTABLE_PATH"
          PACKAGE_PATH="$(dirname "$EXECUTABLE_PATH")"
          test -d "$PACKAGE_PATH"
          echo "path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"

      # Ubuntu 24.04 restricts unprivileged user namespaces, which the Electron sandbox needs
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # A failing smoke test does not withhold the artefacts, so that they can be inspected
      - name: Smoke-test packaged application
        continue-on-error: true
        run: node scripts/smoke-packaged.mjs "${{ steps.package.outputs.path }}" nightly

      # Placing the application and the command-line tool side by side in one archive
      - name: Bundle application and command-line tool
        run: |
          set -euo pipefail
          STAGE=dist/shift-linux-x64
          rm -rf dist
          mkdir -p "$STAGE"
          cp -R "${{ steps.package.outputs.path }}/." "$STAGE/"
          install -m 755 target/release/shift-cli "$STAGE/shift-cli"
          tar -czf dist/shift-linux-x64.tar.gz -C dist shift-linux-x64

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: shift-linux-x64
          path: dist/shift-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
